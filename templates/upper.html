<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Boiling Plate</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ENjdO4Dr2bkBIFxQpeo5e7kUt8CU9EIsD35o6qLGzTZLlR9gwdPr8P8dSkpGkn7+" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('button') }}">Filter</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('product_registration') }}">Add Product</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                    </li>
                    <li class="nav-item">
                      <a class="nav-link" href="{{ url_for('registration') }}">Registration</a>
                    </li>
                </ul>
                <form class="form-inline d-flex flex-column align-items-start p-3 border rounded bg-light" action="/search" method="POST">
                <h4 class="mb-3">Get the blogs of product using the product link</h4>
                <div class="d-flex w-100">
                    <input 
                        class="form-control me-2 flex-grow-1" 
                        type="search" 
                        name="search" 
                        placeholder="Enter product link" 
                        aria-label="Search"
                    >
                    <button 
                        class="btn btn-success" 
                        type="submit"
                    >Search</button>
                </div>
                </form>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-qrv7TgD6rdosM0LtVURHBVvvrzHqVbV7Z1kk8qOw5V1gaSBB3gjVV0z38BXxnbh9" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
